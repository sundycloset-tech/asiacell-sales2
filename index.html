<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d32f2f">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>نظام مبيعات آسياسيل إكسبريس | بني منصور</title>
<style>
:root{--red:#d32f2f;--line:#8c7f7b;--alt:#f5f5f5;--sel:#fff3f3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff;color:#222;font-family:Tahoma,Arial,sans-serif}
body{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
.logo{background:radial-gradient(circle at 50% 40%,#2a0b0b,#100505);display:flex;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) 8px 12px}
.logo img{width:min(38vw,150px);height:auto;aspect-ratio:1;border-radius:50%;display:block;box-shadow:0 0 18px rgba(255,30,30,.35)}
.title{background:var(--red);color:#fff;text-align:center;font-weight:700;font-size:18px;padding:10px 8px}
.months{display:flex;gap:8px;padding:8px;background:#fff;border-bottom:1px solid var(--line)}
.months select{flex:1;min-width:0;font:inherit;font-size:15px;padding:8px 4px;border:1px solid var(--line);border-radius:4px;background:#fff}
.months button{padding:8px 9px;font-size:14px;white-space:nowrap}
button:disabled{opacity:.35}
button{font:inherit;font-size:15px;border:0;border-radius:4px;padding:10px 12px;background:var(--red);color:#fff;font-weight:700}
button:active{opacity:.8}
button.gray{background:#fff;color:var(--red);border:1px solid var(--red)}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{position:sticky;top:0;z-index:2;background:var(--red);color:#fff;font-size:17px;padding:10px 4px;border:2px solid var(--line);border-top:0}
td{border:2px solid var(--line);padding:0;height:48px}
tbody tr:nth-child(odd){background:var(--alt)}
tbody tr:nth-child(even){background:#fff}
tbody tr.sel{background:var(--sel)}
td input{width:100%;height:46px;border:0;background:transparent;font:inherit;font-size:16px;text-align:center;padding:0 4px;outline:none;color:#222}
td input:focus{box-shadow:inset 0 0 0 2px var(--red)}
.foot{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#fff;border-top:1px solid var(--line)}
.total{background:#fff3f3;color:#8c0f0f;font-weight:700;text-align:center;padding:6px 8px;font-size:16px;border-bottom:1px solid #f0c8c8}
.bar{display:flex;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.bar button{flex:1;padding:10px 2px;font-size:14px}
</style>
</head>
<body>
<div class="logo"><img src="logo.jpg" alt="Asiacell Express" width="150" height="150"></div>
<div class="title">مركز آسياسيل | بني منصور - جدول المبيعات</div>
<div class="months">
  <button id="prev" class="gray">السابق</button>
  <select id="month" aria-label="الشهر"></select>
  <button id="next" class="gray">التالي</button>
  <button id="newMonth">+ شهر</button>
</div>
<table>
  <thead><tr><th>الفئة</th><th>السعر</th><th>العدد</th><th>التاريخ</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<div class="foot">
<div class="total">مجموع المبيعات: <span id="tot">0</span> د.ع</div>
<div class="bar">
  <button id="add">+ صف</button>
  <button id="del" class="gray">حذف الصف</button>
  <button id="exp" class="gray">نسخ احتياطي</button>
  <button id="imp" class="gray">استعادة</button>
</div>
</div>
<input type="file" id="file" accept=".json,application/json" hidden>
<script>
(function(){
var KEY='asiacell_sales_v1', MIN_ROWS=25;
var NAMES=['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];
var S, sel=null;
function blank(n){var a=[];for(var i=0;i<(n||MIN_ROWS);i++)a.push(['','','','']);return a}
function ym(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function label(k){var p=k.split('-');return NAMES[+p[1]-1]+' '+p[0]}
function load(){
  try{var s=JSON.parse(localStorage.getItem(KEY));if(valid(s))return s}catch(e){}
  var k=ym(new Date());var m={};m[k]=blank();return {cur:k,months:m};
}
function valid(s){
  if(!s||typeof s!=='object'||!s.months||typeof s.months!=='object')return false;
  var ks=Object.keys(s.months);if(!ks.length)return false;
  for(var i=0;i<ks.length;i++){if(!/^\d{4}-\d{2}$/.test(ks[i])||!Array.isArray(s.months[ks[i]]))return false}
  if(!s.months[s.cur])s.cur=ks.sort().pop();
  return true;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('تعذّر حفظ البيانات. اعمل نسخة احتياطية الآن.')}}
function keys(){return Object.keys(S.months).sort()}
function num(s){
  s=String(s==null?'':s).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)});
  s=s.replace(/[٬,،\s]/g,'').replace('٫','.');var n=parseFloat(s);return isNaN(n)?0:n;
}
function updateTotal(){
  var t=0;S.months[S.cur].forEach(function(r){var p=num(r[1]);if(!p)return;var c=String(r[2]||'').trim()===''?1:num(r[2]);t+=p*c});
  document.getElementById('tot').textContent=t.toLocaleString('en-US',{maximumFractionDigits:2});
}
function step(d){var k=keys(),i=k.indexOf(S.cur)+d;if(i<0||i>=k.length)return;S.cur=k[i];save();render()}
function renderMonths(){
  var sl=document.getElementById('month');sl.innerHTML='';
  keys().forEach(function(k){var o=document.createElement('option');o.value=k;o.textContent=label(k);if(k===S.cur)o.selected=true;sl.appendChild(o)});
  var ks=keys(),i=ks.indexOf(S.cur);document.getElementById('prev').disabled=i<=0;document.getElementById('next').disabled=i>=ks.length-1;
}
function render(focusRow){
  sel=null;renderMonths();
  var tb=document.getElementById('rows');tb.innerHTML='';
  var rows=S.months[S.cur];
  rows.forEach(function(r,i){
    var tr=document.createElement('tr');
    for(var c=0;c<4;c++){
      var td=document.createElement('td'),inp=document.createElement('input');
      inp.type='text';inp.value=r[c]||'';inp.dataset.r=i;inp.dataset.c=c;
      inp.setAttribute('autocomplete','off');
      if(c===1||c===2)inp.setAttribute('inputmode','decimal');
      td.appendChild(inp);tr.appendChild(td);
    }
    tb.appendChild(tr);
  });
  updateTotal();
  if(focusRow!=null){var t=tb.children[focusRow];if(t){t.scrollIntoView({block:'center'});t.querySelector('input').focus()}}
}
var tb=document.getElementById('rows');
tb.addEventListener('input',function(e){
  var t=e.target,r=+t.dataset.r,c=+t.dataset.c;
  S.months[S.cur][r][c]=t.value;save();updateTotal();
});
tb.addEventListener('focusin',function(e){
  var r=+e.target.dataset.r;sel=r;
  Array.prototype.forEach.call(tb.children,function(tr,i){tr.classList.toggle('sel',i===r)});
});
document.getElementById('month').addEventListener('change',function(){S.cur=this.value;save();render()});
document.getElementById('prev').onclick=function(){step(-1)};
document.getElementById('next').onclick=function(){step(1)};
document.getElementById('add').onclick=function(){var a=S.months[S.cur];a.push(['','','','']);save();render(a.length-1)};
document.getElementById('del').onclick=function(){
  if(sel==null){alert('اضغط على أي خانة في الصف الذي تريد حذفه أولاً.');return}
  if(!confirm('حذف هذا الصف؟'))return;
  var a=S.months[S.cur];a.splice(sel,1);if(!a.length)a.push(['','','','']);save();render();
};
document.getElementById('newMonth').onclick=function(){
  var last=keys().pop().split('-'),y=+last[0],m=+last[1]+1;if(m>12){m=1;y++}
  var k=y+'-'+String(m).padStart(2,'0');
  if(!confirm('فتح صفحة شهر جديد: '+label(k)+'؟\nالأشهر السابقة تبقى محفوظة.'))return;
  if(!S.months[k])S.months[k]=blank();S.cur=k;save();render();window.scrollTo(0,0);
};
document.getElementById('exp').onclick=function(){
  var d=new Date(),name='asiacell-sales-'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.json';
  var json=JSON.stringify({app:'asiacell-sales',version:1,data:S});
  var file=new File([json],name,{type:'application/json'});
  function dl(){var a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500)}
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:name}).catch(function(e){if(e&&e.name!=='AbortError')dl()});
  }else dl();
};
document.getElementById('imp').onclick=function(){document.getElementById('file').click()};
document.getElementById('file').addEventListener('change',function(){
  var f=this.files[0];this.value='';if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var o=JSON.parse(rd.result),d=o&&o.data?o.data:o;
      if(!valid(d))throw 0;
      if(!confirm('سيتم استبدال كل البيانات الحالية بالنسخة الاحتياطية. متابعة؟'))return;
      S=d;save();render();alert('تمت الاستعادة.');
    }catch(e){alert('الملف غير صالح.')}
  };
  rd.readAsText(f);
});
S=load();save();render();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body>
</html>
